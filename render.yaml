services:
  - type: web
    name: indian-equity-research-engine
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT --log-level info"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: PYTHONUNBUFFERED
        value: "1"
